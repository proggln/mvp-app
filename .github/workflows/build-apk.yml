name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# builds wait for each other, so two of them never fight over the "latest" release
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project and add our code
        run: |
          flutter create --org org.playmvp --project-name app --platforms=android build_app
          rm -rf build_app/test
          cp -r lib/. build_app/lib/
          mkdir -p build_app/assets
          cp assets/*.png build_app/assets/
          python3 scripts/patch_pubspec.py build_app/pubspec.yaml
          printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/logo.png"\n' > build_app/flutter_launcher_icons.yaml
          python3 scripts/patch_manifest.py build_app/android/app/src/main/AndroidManifest.xml
          if [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json build_app/android/app/google-services.json
            python3 scripts/patch_gradle.py build_app/android
          fi
          python3 scripts/patch_desugar.py build_app/android
          cd build_app
          flutter pub add http url_launcher firebase_core firebase_messaging open_filex shared_preferences:2.3.5 share_plus:10.1.4
          flutter pub add dev:flutter_launcher_icons
          flutter pub get
          dart run flutter_launcher_icons

      - name: Set up app signing
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ]; then
            echo "$KS" | base64 -d > build_app/android/app/release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=mvp\nstoreFile=release.jks\n' "$KP" "$KP" > build_app/android/key.properties
            if ! keytool -list -keystore build_app/android/app/release.jks -storepass "$KP" -alias mvp > /dev/null 2>&1; then
              echo "::error::KEYSTORE_PASSWORD does not match the key (or KEYSTORE_BASE64 is damaged). Set both secrets again."
              exit 1
            fi
            python3 scripts/patch_signing.py build_app/android
          else
            echo "No signing key set: building with a temporary debug key (updates will not install over older builds)."
          fi

      - name: Build the APK
        working-directory: build_app
        shell: bash
        run: |
          set +e
          flutter build apk --release --no-shrink --dart-define=BUILD=${{ github.run_number }} 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::$(grep -E "rror:|Error:|e: " build.log | cut -c1-170 | sort -u | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')"
            grep -E "What went wrong" -A10 build.log | head -4 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: mvp-app-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish the APK for download
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          cp build_app/build/app/outputs/flutter-apk/app-release.apk mvp-app.apk
          # the code repository is private: downloads live in the small public repo mvp-releases
          # a brand new repository has no commits yet, and a release needs one: add a README the first time
          fail() { echo "::error::$1: $(echo "$2" | tr '\n' ' ' | cut -c1-300)"; exit 1; }
          if ! out=$(gh api repos/proggln/mvp-releases/contents/README.md 2>&1); then
            out=$(gh api -X PUT repos/proggln/mvp-releases/contents/README.md -f message="Add README" -f content="$(printf 'Downloads for the MVP Android app.\n' | base64 -w0)" 2>&1) || fail "README step" "$out"
          fi
          gh release delete latest --repo proggln/mvp-releases --cleanup-tag --yes >/dev/null 2>&1 || true
          out=$(gh release create latest mvp-app.apk --repo proggln/mvp-releases --title "MVP app build ${{ github.run_number }}" --notes "Latest Android build of the MVP app." 2>&1) || fail "Release step" "$out"

      # for now the old public place also gets the build, so phones on build 71 and older can still update from inside the app.
      # Remove this step when you make the code repository private.
      - name: Publish the APK in the old place (temporary)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest mvp-app.apk --title "MVP app build ${{ github.run_number }}" --notes "Latest Android build of the MVP app."
